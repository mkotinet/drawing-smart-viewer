services:
  drawing-smart-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: drawing-smart-viewer:latest
    container_name: ${CONTAINER_NAME:-drawing-smart-viewer}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3095}:8000"
    mem_limit: 256m
    memswap_limit: 512m
    cpu_shares: 512
    oom_score_adj: 500
    environment:
      - TZ=Asia/Seoul
      - DATA_DIR=/app/data
      - PORT=8000
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SYNC_TOKEN=${SYNC_TOKEN}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - drawing_viewer_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  drawing_viewer_data:
    name: drawing_viewer_data
